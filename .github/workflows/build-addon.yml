name: Build Bedrock Add-on

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and build
        run: python tools/build_mcaddon.py

      - name: Upload Bedrock packages
        uses: actions/upload-artifact@v4
        with:
          name: DLavie-Conquest-Nature
          path: dist/*
          if-no-files-found: error
